{# Shop sidebar extras: sticky sidebar, active-filter chips, live results counter.
   Included at the end of the filters column (item_group + all-products). #}
<style>
	@media (min-width: 768px) {
		#product-filters {
			position: sticky;
			top: 16px;
			max-height: calc(100vh - 32px);
			overflow-y: auto;
			overflow-x: hidden;
			padding-right: 6px;
		}
	}
	#active-filter-chips { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
	@media (min-width: 768px) { #active-filter-chips { order: -1; } }
	#active-filter-chips.has-chips { display: flex; }
	.afc-chip {
		display: inline-flex; align-items: center; gap: 6px;
		background: #1a1a1a; color: #fff; border-radius: 999px;
		padding: 3px 10px; font-size: 0.75rem; line-height: 1.4; cursor: default;
	}
	.afc-chip button {
		background: none; border: none; color: #fff; cursor: pointer;
		font-size: 0.9rem; line-height: 1; padding: 0; opacity: 0.75;
	}
	.afc-chip button:hover { opacity: 1; }
	/* collapsible filter sections */
	#product-filters .filter-block > .filter-label {
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: space-between;
		user-select: none;
	}
	#product-filters .filter-block > .filter-label::after {
		content: "";
		width: 8px; height: 8px;
		border-right: 2px solid #9ca3af;
		border-bottom: 2px solid #9ca3af;
		transform: rotate(45deg);
		transition: transform 0.15s ease;
		margin-left: 8px; margin-top: -4px;
		flex-shrink: 0;
	}
	#product-filters .filter-block.afc-collapsed > .filter-label::after { transform: rotate(-45deg); margin-top: 2px; }
	#product-filters .filter-block.afc-collapsed > *:not(.filter-label) { display: none !important; }
	#results-count-live { font-size: 0.8rem; color: #6b7280; font-weight: 400; margin-left: 8px; white-space: nowrap; }
</style>
<div id="active-filter-chips" aria-live="polite"></div>
<script>
(function() {
	const pf = document.getElementById('product-filters');
	if (!pf) return;

	/* ---- live results counter (reads the listing API responses) ---- */
	const title = pf.querySelector('.filters-title');
	let counter = null;
	if (title) {
		counter = document.createElement('span');
		counter.id = 'results-count-live';
		title.appendChild(counter);
	}
	const productsWord = (window.product_translations && window.product_translations['products']) || 'produits';
	function setCount(n) {
		if (counter && typeof n === 'number') counter.textContent = '· ' + n + ' ' + productsWord;
	}
	// The listing bundle refreshes via a full-page XHR (no JSON to sniff), so the
	// counter makes its own lightweight call to the filter API, debounced.
	let countTimer = null;
	function refreshCount() {
		clearTimeout(countTimer);
		countTimer = setTimeout(function() {
			const field_filters = {};
			pf.querySelectorAll('input.field-filter:checked').forEach(function(i) {
				const k = i.dataset.filterName, v = i.dataset.filterValue;
				if (!k || !v) return;
				(field_filters[k] = field_filters[k] || []).push(v);
			});
			fetch('/api/method/webshop.webshop.api.get_product_filter_data', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'X-Frappe-CSRF-Token': (window.frappe && frappe.csrf_token) || ''
				},
				body: JSON.stringify({ query_args: { field_filters: field_filters, attribute_filters: {}, start: 0 } })
			}).then(function(r) { return r.json(); }).then(function(d) {
				const m = (d && d.message) || {};
				const n = (typeof m.total_count === 'number') ? m.total_count : m.items_count;
				if (typeof n === 'number') setCount(n);
			}).catch(function() {});
		}, 400);
	}
	pf.addEventListener('change', function(e) {
		if (e.target && e.target.matches('input[type="checkbox"]')) refreshCount();
	});
	setTimeout(refreshCount, 1200);

	/* ---- active filter chips ---- */
	const chipsBox = document.getElementById('active-filter-chips');
	function labelFor(input) {
		const lab = input.closest('label');
		if (lab) return (lab.querySelector('.label-area') || lab).textContent.trim().split('\n')[0].trim().slice(0, 28);
		const blockLab = input.closest('.filter-lookup-wrapper');
		return blockLab ? blockLab.textContent.trim().slice(0, 28) : (input.dataset.filterValue || '');
	}
	function rebuildChips() {
		if (!chipsBox) return;
		const checked = [...pf.querySelectorAll('input[type="checkbox"]:checked')];
		chipsBox.innerHTML = '';
		checked.forEach(input => {
			const chip = document.createElement('span');
			chip.className = 'afc-chip';
			const txt = document.createElement('span');
			txt.textContent = labelFor(input);
			const x = document.createElement('button');
			x.type = 'button';
			x.setAttribute('aria-label', 'Retirer');
			x.textContent = '×';
			x.addEventListener('click', function() {
				input.checked = false;
				input.dispatchEvent(new Event('change', { bubbles: true }));
				setTimeout(rebuildChips, 50);
			});
			chip.appendChild(txt);
			chip.appendChild(x);
			chipsBox.appendChild(chip);
		});
		chipsBox.classList.toggle('has-chips', checked.length > 0);
	}
	pf.addEventListener('change', function(e) {
		if (e.target && e.target.matches('input[type="checkbox"]')) setTimeout(rebuildChips, 50);
	});
	// filters restored from the URL by the listing bundle land after init
	setTimeout(rebuildChips, 800);
	setTimeout(rebuildChips, 2500);

	/* ---- collapsible sections (state remembered per label) ---- */
	try {
		const KEY = 'shop_sidebar_collapsed';
		const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
		pf.querySelectorAll('.filter-block').forEach(function(block) {
			const label = block.querySelector('.filter-label');
			if (!label) return;
			const id = label.textContent.trim().split('·')[0].trim().slice(0, 30);
			if (saved[id]) block.classList.add('afc-collapsed');
			label.addEventListener('click', function(e) {
				if (e.target.closest('input,button,a')) return;
				const collapsed = block.classList.toggle('afc-collapsed');
				saved[id] = collapsed ? 1 : 0;
				try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (err) {}
			});
		});
	} catch (e) {}
})();
</script>
