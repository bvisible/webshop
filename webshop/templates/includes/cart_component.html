{% set cart_data = get_cart_data() %}
<div id="cart-data" 
  data-cart-info='{{ json.dumps(cart_data.cart_info) }}' 
  data-cart-items='{{ json.dumps(cart_data.cart_items) }}' 
  data-cart-items-count='{{ cart_data.cart_items_count }}' 
  data-cart-total='{{ cart_data.cart_total }}' 
  data-currency='{{ cart_data.currency }}' 
  data-tax-info='{{ json.dumps(cart_data.tax_info) }}'>
</div>
<!-- Interface du panier -->
<div class="header-cart">
  <div class="cart-icon-wrapper" id="cartButton">
    <button class="cart-button" aria-label="Ouvrir le panier">
      <svg style="max-width: 30px;max-height: 30px;" xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.555 14.257c-.718-3.353-1.078-5.03-.177-6.143C4.278 7 5.993 7 9.422 7h5.156c3.43 0 5.143 0 6.044 1.114c.9 1.114.541 2.79-.177 6.143l-.429 2c-.487 2.273-.73 3.409-1.555 4.076c-.825.667-1.987.667-4.311.667h-4.3c-2.324 0-3.486 0-4.31-.667c-.826-.667-1.07-1.803-1.556-4.076l-.429-2Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 11h18m-11 3h4m4-5l-3-6M6 9l3-6" opacity=".6"/></g></svg>
      <span id="cartBadge" class="cart-badge" style="display: none;"></span>
    </button>
  </div>
  
  <div id="cartOverlay" class="side-cart-overlay" style="display: none;">
    <div id="sideCart" class="side-cart">
      <div class="side-cart-header">
        <span>Votre Panier</span>
        <button id="closeCartButton" class="close-button">×</button>
      </div>
      <div id="cartLoading" class="cart-loading" style="display: none;">
        <p>Chargement du panier...</p>
      </div>
      
      <div id="emptyCart" class="empty-cart">
        <p>Votre panier est vide</p>
      </div>
      
      <div id="cartItemsContainer" class="cart-items"></div>
      
      <!-- Détails des taxes -->
      <div id="cartTaxDetails" class="cart-tax-details" style="display: none;">
        <div class="cart-subtotal">
          <span>Sous-total:</span>
          <span id="cartSubtotal">0.00</span>
        </div>
        <div id="cartTaxesContainer" class="cart-taxes"></div>
      </div>
      
      <div id="cartFooter" class="cart-footer" style="display: none;">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cartTotal">0.00</span>
        </div>
        <div class="cart-buttons">
          <a href="/cart" class="view-cart-btn">Voir le panier</a>
          <a href="/checkout" class="checkout-btn btn btn-primary">Passer à la caisse</a>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
/* Styles pour le panier */
.header-cart {
  position: relative;
}

.cart-icon-wrapper {
  position: relative;
  display: inline-block;
}

.cart-button {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 8px;
  color: #333;
}

.cart-badge {
  position: absolute;
  top: 0px;
  right: 0px;
  background-color: #000;
  color: white;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.side-cart-overlay {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.side-cart-overlay.active {
  opacity: 1;
  visibility: visible;
}

.side-cart {
  position: fixed;
  top: 0;
  right: -360px; /* Commence hors écran */
  width: 350px;
  height: 100%;
  background-color: white;
  box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  z-index: 1001;
  transition: right 0.3s ease;
}

.side-cart.active {
  right: 0; /* Animation vers la droite */
}

.side-cart-header {
  padding: 15px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.close-button {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: #333;
}

.cart-loading {
  padding: 20px;
  text-align: center;
}

.empty-cart {
  padding: 30px;
  text-align: center;
  color: #666;
}

.cart-items {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.cart-item {
  display: flex;
  padding: 10px;
  border-bottom: 1px solid #eee;
  position: relative;
}

.cart-item-image {
  width: 60px;
  height: 60px;
  margin-right: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background-color: #f5f5f5;
  border-radius: 4px;
}

.cart-item-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.item-abbr {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #eee;
  color: #666;
  font-weight: bold;
}

.cart-item-details {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-right: 20px;
}

.cart-item-brand {
  font-size: 12px;
  color: #888;
  margin-bottom: 2px;
}

.cart-item-name {
  font-weight: bold;
  margin-bottom: 5px;
  font-size: 14px;
  line-height: 1.3;
}

.cart-item-price {
  color: #666;
  margin-bottom: 5px;
  font-weight: 600;
}

.cart-item-quantity {
  display: flex;
  align-items: center;
}

.qty-btn {
  width: 24px;
  height: 24px;
  border: 1px solid #ddd;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.qty-value {
  margin: 0 8px;
  min-width: 20px;
  text-align: center;
}

.remove-item {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #999;
}

/* Styles pour les détails des taxes */
.cart-tax-details {
  padding: 15px;
  border-top: 1px solid #eee;
  font-size: 14px;
}

.cart-subtotal, .cart-tax-item, .cart-discount-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.cart-subtotal {
  font-weight: 600;
}

.cart-tax-item {
  color: #666;
}

.cart-discount-item {
  color: #e74c3c;
}

.cart-footer {
  padding: 15px;
  border-top: 1px solid #eee;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  margin-bottom: 15px;
  font-size: 16px;
}

/* Boutons du footer */
.cart-buttons {
  display: flex;
  gap: 10px;
  flex-direction: column;
}

.checkout-btn {
  display: block;
  width: 100%;
  padding: 12px !important;
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 4px;
  font-weight: bold;
  transition: background-color 0.3s;
  background-color: #000;
}

.checkout-btn:hover {
  background-color: #2980b9;
}

.view-cart-btn {
  display: block;
  width: 100%;
  padding: 10px;
  background-color: #f8f9fa;
  border: 1px solid #ddd;
  color: #333;
  text-align: center;
  text-decoration: none;
  border-radius: 4px;
  font-weight: bold;
  transition: background-color 0.3s;
  margin-bottom: 10px;
}

.view-cart-btn:hover {
  background-color: #e9ecef;
}

/* Animation d'entrée pour les éléments du panier */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.cart-item {
  animation: fadeIn 0.3s ease forwards;
}

.cart-item:nth-child(2) {
  animation-delay: 0.05s;
}

.cart-item:nth-child(3) {
  animation-delay: 0.1s;
}

.cart-item:nth-child(4) {
  animation-delay: 0.15s;
}

.cart-item:nth-child(5) {
  animation-delay: 0.2s;
}
</style>
<script>
console.log("Initialisation du panier");

// Éléments DOM
const cartDataElement = document.getElementById('cart-data');
const cartBadge = document.getElementById('cartBadge');
const cartButton = document.getElementById('cartButton');
const cartOverlay = document.getElementById('cartOverlay');
const sideCart = document.getElementById('sideCart');
const closeCartButton = document.getElementById('closeCartButton');
const cartItemsContainer = document.getElementById('cartItemsContainer');
const emptyCart = document.getElementById('emptyCart');
const cartFooter = document.getElementById('cartFooter');
const cartTotal = document.getElementById('cartTotal');
const cartSubtotal = document.getElementById('cartSubtotal');
const cartTaxDetails = document.getElementById('cartTaxDetails');
const cartTaxesContainer = document.getElementById('cartTaxesContainer');
const cartLoading = document.getElementById('cartLoading');

// Initialiser les données du panier
let pageData = { 
  cart_items: [], 
  cart_total: 0, 
  cart_items_count: 0,
  currency: 'CHF',
  cart_info: {},
  tax_info: []
};

if (cartDataElement) {
  try {
    // Récupérer les données principales
    pageData = {
      cart_items: JSON.parse(cartDataElement.dataset.cartItems || '[]'),
      cart_total: parseFloat(cartDataElement.dataset.cartTotal || '0'),
      cart_items_count: parseInt(cartDataElement.dataset.cartItemsCount || '0'),
      currency: cartDataElement.dataset.currency || 'EUR'
    };
    
    // Récupérer les informations détaillées si disponibles
    if (cartDataElement.dataset.cartInfo) {
      pageData.cart_info = JSON.parse(cartDataElement.dataset.cartInfo || '{}');
    }
    
    if (cartDataElement.dataset.taxInfo) {
      pageData.tax_info = JSON.parse(cartDataElement.dataset.taxInfo || '[]');
    }
    
    console.log('Données du panier chargées:', pageData);
  } catch (e) {
    console.error('Erreur de parsing des données du panier:', e);
  }
} else {
  console.warn("Élément #cart-data non trouvé dans le DOM");
}

// Formater le prix avec la devise
function formatPrice(price) {
  return `${price.toFixed(2)} ${pageData.currency}`;
}

// Ouvrir le panier avec animation
function openCart() {
  if (cartOverlay) {
    // Rendre l'overlay visible avant l'animation
    cartOverlay.style.visibility = 'visible';
    cartOverlay.style.display = 'inherit';
    
    // Déclencher le reflow pour que les transitions fonctionnent
    void cartOverlay.offsetWidth;
    
    // Ajouter les classes active pour déclencher l'animation
    cartOverlay.classList.add('active');
    
    if (sideCart) {
      sideCart.classList.add('active');
    }
  }
}

// Fermer le panier avec animation
function closeCart() {
  console.log("Fermeture du panier"); // Debug
  
  if (cartOverlay && cartOverlay.classList.contains('active')) {
    // Retirer les classes active pour lancer l'animation de fermeture
    cartOverlay.classList.remove('active');
    
    if (sideCart) {
      sideCart.classList.remove('active');
    }
    
    // Attendre la fin de l'animation avant de cacher l'overlay
    setTimeout(() => {
      cartOverlay.style.visibility = 'hidden';
    }, 300); // Durée de l'animation en ms
  }
}

// Mettre à jour l'interface du panier
function updateCartUI() {
  // Mettre à jour le badge
  if (cartBadge) {
    if (pageData.cart_items_count > 0) {
      cartBadge.textContent = pageData.cart_items_count;
      cartBadge.style.display = 'flex';
    } else {
      cartBadge.style.display = 'none';
    }
  }

  // Mettre à jour le montant total avec la devise
  if (cartTotal) {
    cartTotal.textContent = formatPrice(pageData.cart_total);
  }

  // Afficher ou masquer l'interface en fonction du contenu
  if (pageData.cart_items.length === 0) {
    if (emptyCart) emptyCart.style.display = 'block';
    if (cartItemsContainer) cartItemsContainer.style.display = 'none';
    if (cartFooter) cartFooter.style.display = 'none';
    if (cartTaxDetails) cartTaxDetails.style.display = 'none';
  } else {
    if (emptyCart) emptyCart.style.display = 'none';
    if (cartItemsContainer) {
      cartItemsContainer.style.display = 'block';
      renderCartItems(); // Générer le HTML pour les articles
    }
    if (cartFooter) cartFooter.style.display = 'block';
    
    // Afficher les détails des taxes si disponibles
    if (cartTaxDetails && pageData.tax_info && pageData.tax_info.length > 0) {
      renderTaxInfo();
      cartTaxDetails.style.display = 'block';
    } else if (cartTaxDetails) {
      cartTaxDetails.style.display = 'none';
    }
  }
}

// Générer le HTML pour les articles du panier
function renderCartItems() {
  if (!cartItemsContainer) return;

  cartItemsContainer.innerHTML = '';

  pageData.cart_items.forEach(item => {
    const itemElement = document.createElement('div');
    itemElement.className = 'cart-item';
    
    // Utiliser le thumbnail si disponible, sinon l'image principale, sinon placeholder
    const imageUrl = item.thumbnail || item.website_image || '/images/placeholder.png';
    const abbr = item.abbr || '';
    const itemName = item.item_name || '';
    const quantity = item.qty || 1;
    const price = item.rate || 0;
    const brand = item.brand || '';
    const itemCode = item.item_code || '';
    
    itemElement.innerHTML = `
      <div class="cart-item-image">
        ${(item.thumbnail || item.website_image) ? 
          `<img src="${imageUrl}" alt="${itemName}" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\\'item-abbr\\'>${abbr}</div>';" />` : 
          `<div class="item-abbr">${abbr}</div>`}
      </div>
      <div class="cart-item-details">
        ${brand ? `<div class="cart-item-brand">${brand}</div>` : ''}
        <div class="cart-item-name">${itemName}</div>
        <div class="cart-item-price">${formatPrice(price)}</div>
        <div class="cart-item-quantity">
          <button class="qty-btn minus" data-item-code="${itemCode}" data-action="decrease">-</button>
          <span class="qty-value">${quantity}</span>
          <button class="qty-btn plus" data-item-code="${itemCode}" data-action="increase">+</button>
        </div>
      </div>
      <button class="remove-item" data-item-code="${itemCode}" aria-label="Supprimer l'article">×</button>
    `;
    
    cartItemsContainer.appendChild(itemElement);
  });

  // Ajouter les événements pour les boutons
  addCartButtonEvents();
}

// Afficher les détails des taxes
function renderTaxInfo() {
  if (!cartTaxesContainer || !cartSubtotal) return;
  
  // Afficher le sous-total
  const subtotal = pageData.cart_info.total || 0;
  cartSubtotal.textContent = formatPrice(subtotal);
  
  // Générer les lignes de taxes
  cartTaxesContainer.innerHTML = '';
  
  pageData.tax_info.forEach(tax => {
    if (tax.tax_amount > 0) {
      const taxItem = document.createElement('div');
      taxItem.className = 'cart-tax-item';
      
      // Extraire le pourcentage du nom de la taxe si disponible
      let taxName = tax.description;
      const taxMatch = tax.description.match(/TVA\s+(\d+\.\d+)%/);
      if (taxMatch && taxMatch[1]) {
        taxName = `TVA ${taxMatch[1]}%`;
      }
      
      taxItem.innerHTML = `
        <span>${taxName}:</span>
        <span>${formatPrice(tax.tax_amount)}</span>
      `;
      
      cartTaxesContainer.appendChild(taxItem);
    }
  });
  
  // Afficher la remise si présente
  if (pageData.cart_info.discount_amount && pageData.cart_info.discount_amount > 0) {
    const discountItem = document.createElement('div');
    discountItem.className = 'cart-discount-item';
    
    discountItem.innerHTML = `
      <span>Remise:</span>
      <span>-${formatPrice(pageData.cart_info.discount_amount)}</span>
    `;
    
    cartTaxesContainer.appendChild(discountItem);
  }
}

// Ajouter les événements aux boutons du panier
function addCartButtonEvents() {
  // Boutons de quantité
  const qtyButtons = document.querySelectorAll('.qty-btn');
  qtyButtons.forEach(button => {
    button.addEventListener('click', handleQuantityChange);
  });

  // Boutons de suppression
  const removeButtons = document.querySelectorAll('.remove-item');
  removeButtons.forEach(button => {
    button.addEventListener('click', handleRemoveItem);
  });
}

// Gérer le changement de quantité
function handleQuantityChange(e) {
  const itemCode = e.target.dataset.itemCode;
  const action = e.target.dataset.action;

  if (!itemCode) {
    console.error("Code article manquant pour la mise à jour de la quantité");
    return;
  }

  // Afficher l'indicateur de chargement
  if (cartLoading) cartLoading.style.display = 'block';

  // Appeler l'API pour mettre à jour la quantité
  fetch('/api/method/webshop.webshop.shopping_cart.cart.update_cart', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Frappe-CSRF-Token': frappe.csrf_token
    },
    body: JSON.stringify({
      item_code: itemCode,
      qty: action === 'increase' ? 1 : -1,
      additional_notes: ''
    })
  })
  .then(response => response.json())
  .then(data => {
    // Rafraîchir le panier
    refreshCart();
  })
  .catch(error => {
    console.error('Erreur lors de la mise à jour du panier:', error);
    if (cartLoading) cartLoading.style.display = 'none';
  });
}

// Gérer la suppression d'un article
function handleRemoveItem(e) {
  const itemCode = e.target.dataset.itemCode;

  if (!itemCode) {
    console.error("Code article manquant pour la suppression");
    return;
  }

  // Afficher l'indicateur de chargement
  if (cartLoading) cartLoading.style.display = 'block';

  // Appeler l'API pour supprimer l'article
  fetch('/api/method/webshop.webshop.shopping_cart.cart.update_cart', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Frappe-CSRF-Token': frappe.csrf_token
    },
    body: JSON.stringify({
      item_code: itemCode,
      qty: 0,
      additional_notes: ''
    })
  })
  .then(response => response.json())
  .then(data => {
    // Rafraîchir le panier
    refreshCart();
  })
  .catch(error => {
    console.error('Erreur lors de la suppression de l\'article:', error);
    if (cartLoading) cartLoading.style.display = 'none';
  });
}

// Rafraîchir le panier
function refreshCart() {
  fetch('/api/method/webshop.webshop.shopping_cart.cart.get_cart_info')
    .then(response => response.json())
    .then(data => {
      if (data.message) {
        // Mettre à jour les données de base
        pageData.cart_items = data.message.items || [];
        pageData.cart_total = data.message.total || 0;
        pageData.cart_items_count = data.message.total_qty || 0;
        
        // Conserver la devise actuelle
        // Note: la réponse API ne renvoie pas la devise, donc nous la conservons
        
        updateCartUI();
      }
      
      if (cartLoading) cartLoading.style.display = 'none';
    })
    .catch(error => {
      console.error('Erreur lors du rafraîchissement du panier:', error);
      if (cartLoading) cartLoading.style.display = 'none';
    });
}

// Configuration des événements initiaux

// Ouvrir le panier
if (cartButton) {
  cartButton.addEventListener('click', function(e) {
    e.preventDefault();
    openCart();
  });
}

// Fermer le panier avec le bouton de fermeture (×)
if (closeCartButton) {
  closeCartButton.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation(); // Empêcher la propagation aux éléments parents
    closeCart();
  });
}

// Fermer le panier en cliquant en dehors
if (cartOverlay) {
  cartOverlay.addEventListener('click', function(e) {
    if (e.target === cartOverlay) {
      closeCart();
    }
  });
}

// Empêcher la propagation du clic depuis le panier lui-même
if (sideCart) {
  sideCart.addEventListener('click', function(e) {
    e.stopPropagation(); // Empêcher les clics dans le panier de fermer le panier
  });
}

// Initialiser l'interface du panier
updateCartUI();
</script>
