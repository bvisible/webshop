<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Charger dynamiquement le script de recherche sans jQuery
    var script = document.createElement('script');
    script.src = '/assets/webshop/js/product_ui/search_no_jquery.js';
    script.onload = function() {
      // Initialiser le composant de recherche après le chargement du script
      setTimeout(function() {
        if (typeof webshop !== 'undefined' && typeof webshop.ProductSearchNoJQuery !== 'undefined') {
          new webshop.ProductSearchNoJQuery();
        } else {
          console.error("Le composant de recherche webshop n'a pas pu être chargé.");
        }
      }, 100); // Un petit délai pour s'assurer que tout est bien chargé
    };
    script.onerror = function() {
      console.error("Erreur lors du chargement du script de recherche webshop.");
    };
    document.head.appendChild(script);
  });
</script>
