<!-- Component for authentication - Dynamic loading to avoid cache issues -->
{% from "frappe/templates/includes/avatar_macro.html" import avatar %}

<div class="header-auth" id="header-auth">
    <div class="auth-wrapper" id="authButton">
      <div class="auth-button">
        <!-- Default: show login icon (will be replaced by JS if logged in) -->
        <span id="auth-login-view">
            <svg class="login-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path fill="currentColor" d="M9.76 0C15.417 0 20 4.477 20 10S15.416 20 9.76 20c-3.191 0-6.142-1.437-8.07-3.846a.644.644 0 0 1 .115-.918a.68.68 0 0 1 .94.113a8.96 8.96 0 0 0 7.016 3.343c4.915 0 8.9-3.892 8.9-8.692c0-4.8-3.985-8.692-8.9-8.692a8.961 8.961 0 0 0-6.944 3.255a.68.68 0 0 1-.942.101a.644.644 0 0 1-.103-.92C3.703 1.394 6.615 0 9.761 0Zm.545 6.862l2.707 2.707c.262.262.267.68.011.936L10.38 13.15a.662.662 0 0 1-.937-.011a.662.662 0 0 1-.01-.937l1.547-1.548l-10.31.001A.662.662 0 0 1 0 10c0-.361.3-.654.67-.654h10.268L9.38 7.787a.662.662 0 0 1-.01-.937a.662.662 0 0 1 .935.011Z"/></svg>
            <span id="authText">{{ _("Log in") }}</span>
        </span>
        <!-- Logged in view (hidden by default, shown by JS) -->
        <span id="auth-user-view" style="display: none;">
            <span class="my-account-avatar" id="user-avatar"></span>
            <span id="authText-user"></span>
        </span>

        <div class="dropdown-menu dropdown-menu-right" id="user-dropdown" style="display: none;">
            <a class="dropdown-item" href="/me">{{ _('My account') }}</a>
            <a class="dropdown-item" href="/orders">{{ _('My orders') }}</a>
            <a class="dropdown-item" href="/wishlist">{{ _('My wishlist') }}</a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item logout-link" href="javascript:void(0);">{{ _('Logout') }}</a>
        </div>
        </div>
    </div>
</div>

{% block styles %}
<style>
    .header-auth {
        display: inline-flex;
        align-items: center;
        margin-left: 15px;
    }

    .auth-wrapper {
        cursor: pointer;
        position: relative;
    }

    .auth-button {
        display: flex;
        align-items: center;
        background: transparent;
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.2s;
    }

    .auth-button:hover {
        background-color: rgba(0, 0, 0, 0.05);
    }

    .auth-button svg {
        margin-right: 8px;
    }

    #authText, #authText-user {
        font-size: 14px;
        margin-left: 5px;
    }

    .welcome-header {
        justify-content: space-between !important;
        display: flex !important;
    }
    .welcome-header h3 {
        font-weight: 600;
        margin: 0;
    }
    .login-dialog .email-field input {
        flex: 1;
        padding-left: 35px;
        border-radius: 4px 0 0 4px;
        height: 28px;
        appearance: menulist-button;
        background-image: none !important;
        background-color: light-dark(rgb(232, 240, 254), rgba(70, 90, 126, 0.4)) !important;
        color: fieldtext !important;
        border: none;
    }
    .login-dialog input[type="text"], .login-dialog input[type="password"] {
        display: block;
        width: 100%;
        height: 28px;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: rgb(82, 82, 82);
        background-color: rgb(243, 243, 243);
        background-clip: padding-box;
        padding: 0.375rem 0.75rem;
        border-width: 1px;
        border-style: solid;
        border-color: rgb(243, 243, 243);
        border-image: initial;
        border-radius: 0.375rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .login-dialog input[type="text"]:focus,
    .login-dialog input[type="password"]:focus {
        border: none!important;
        box-shadow: none!important;
    }
    .login-dialog .password-field input {
        padding-left: 35px;
        padding-right: 50px;
    }
    .login-dialog .btn-verify-email {
        background-color: black;
        color: white;
    }
    .login-dialog .btn-primary {
        padding: 4px 8px;
        box-shadow: none;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0.02em;
        border-width: initial;
        border-style: none;
        border-color: initial;
        border-image: initial;
        border-radius: 8px;
        font-family: inherit;
    }
    .avatar .standard-image {
        border-radius: 50%;
        border: none;
    }
    .avatar-small .standard-image, .avatar-group .avatar-action .standard-image {
        font-size: 12px;
    }
    .standard-image {
        width: 100%;
        height: 100%;
        -o-object-fit: cover;
        object-fit: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f3f3f3;
        color: #999999;
        border: 1px solid #f3f3f3;
        font-weight: normal;
    }
    .avatar-frame {
        display: flex;
        width: 100%;
        height: 100%;
        -o-object-fit: cover;
        object-fit: cover;
        background-color: #f3f3f3;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center center;
        border-radius: 50%;
    }
    .avatar-small, .avatar-group .avatar-action {
        width: 28px;
        height: 28px;
        text-align: center;
    }
    .avatar {
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
    }

    /* Styles for dropdown menu */
    .dropdown-menu {
        position: absolute;
        top: 100%;
        right: 0;
        z-index: 1000;
        display: none;
        min-width: 200px;
        padding: 0.5rem 0;
        margin: 0.125rem 0 0;
        font-size: 14px;
        color: #383838;
        text-align: left;
        list-style: none;
        background-color: white;
        background-clip: padding-box;
        border: 1px solid #ededed;
        border-radius: 0.375rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.175);
    }

    .dropdown-menu.show {
        display: block;
    }

    .dropdown-menu-right {
        right: 0;
        left: auto;
    }

    .dropdown-item {
        display: block;
        width: 100%;
        padding: 4px 8px;
        clear: both;
        font-weight: 400;
        color: #383838;
        text-align: inherit;
        white-space: nowrap;
        background-color: transparent;
        border: 0;
        text-decoration: none;
        transition: background-color 0.2s;
    }

    .dropdown-item:hover, .dropdown-item:focus {
        color: #16181b;
        text-decoration: none;
        background-color: #f8f9fa;
    }

    .dropdown-divider {
        height: 0;
        margin: 0.5rem 0;
        overflow: hidden;
        border-top: 1px solid #e9ecef;
    }

    .auth-wrapper {
        position: relative;
    }
</style>
{% endblock %}
<script>
// Dynamic user header loading to avoid cache issues
(function() {
    const authButton = document.getElementById('authButton');
    const loginView = document.getElementById('auth-login-view');
    const userView = document.getElementById('auth-user-view');
    const userDropdown = document.getElementById('user-dropdown');
    const userAvatar = document.getElementById('user-avatar');
    const authTextUser = document.getElementById('authText-user');

    // Fetch user info via API (bypasses page cache)
    function loadUserInfo() {
        fetch('/api/method/webshop.webshop.utils.utils.get_user_header_info', {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            credentials: 'same-origin'
        })
        .then(response => response.json())
        .then(data => {
            if (data.message && data.message.is_logged_in) {
                // User is logged in - show user view
                loginView.style.display = 'none';
                userView.style.display = 'flex';
                userView.style.alignItems = 'center';

                // Set avatar
                if (userAvatar && data.message.avatar) {
                    userAvatar.innerHTML = data.message.avatar;
                }

                // Set greeting text
                if (authTextUser) {
                    authTextUser.textContent = '{{ _("Hi") }} ' + (data.message.first_name || '');
                }

                // Setup dropdown toggle
                setupLoggedInBehavior();
            } else {
                // User is guest - show login view (already default)
                setupGuestBehavior();
            }
        })
        .catch(error => {
            console.error('Error loading user info:', error);
            // On error, default to guest behavior
            setupGuestBehavior();
        });
    }

    function setupGuestBehavior() {
        authButton.onclick = function() {
            if (typeof frappe !== 'undefined' && frappe.showLoginDialog) {
                frappe.showLoginDialog();
            } else {
                window.location.href = '/login';
            }
        };
        {% include 'webshop/public/js/utils/frappe-mock.js'  %}
        {% include 'webshop/public/js/auth_dialog.js' %}
    }

    function setupLoggedInBehavior() {
        // Configure dropdown toggle
        authButton.onclick = function(event) {
            event.stopPropagation();
            userDropdown.classList.toggle('show');
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            if (!authButton.contains(event.target) && userDropdown.classList.contains('show')) {
                userDropdown.classList.remove('show');
            }
        });

        // Configure logout link
        const logoutLink = document.querySelector('.logout-link');
        if (logoutLink) {
            logoutLink.addEventListener('click', function(e) {
                e.preventDefault();

                const xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/method/logout', true);
                xhr.setRequestHeader('Accept', 'application/json');
                xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        window.location.reload();
                    } else {
                        console.error('Error during logout');
                    }
                };

                xhr.onerror = function() {
                    console.error('Network error during logout');
                };

                xhr.send();
            });
        }
    }

    // Load user info on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadUserInfo);
    } else {
        loadUserInfo();
    }
})();
</script>
