<div class="payment-form" id="{{ payment_form_id }}">
    <div class="form-row row">
        <div class="col-md-6 mb-3">
            <label for="cardholder-name">{{ _("Cardholder Name") }}</label>
            <input type="text" id="cardholder-name" name="cardholder-name" class="form-control mr-3 w-100 font-md" placeholder="{{ _('John Doe') }}"/>
        </div>
        <div class="col-md-6 mb-3">
            <label for="cardholder-email">{{ _("Cardholder Email") }}</label>
            <input type="email" id="cardholder-email" name="cardholder-email" class="form-control mr-3 w-100 font-md" placeholder="{{ _('john@doe.com') }}"/>
        </div>
    </div>

    <!-- iFrame container (hidden by default, shown for iFrame mode) -->
    <div id="wallee-iframe-container-{{ submit_id }}" class="wallee-iframe-container mb-3" style="display: none; min-height: 300px;"></div>

    <div class="outcome text-center mb-4">
        <div class="error payment-message wallee-error-{{ submit_id }}" role="alert"></div>
        <div class="success payment-message wallee-success-{{ submit_id }}" role="alert"></div>
    </div>
    <div class="mt-4 d-flex justify-content-between align-items-center">
        <div class="form-check mb-3" id="terms-container-{{ submit_id }}">
            <input type="checkbox" class="form-check-input cursor-pointer terms-acceptance" id="terms-{{ submit_id }}" required>
            <label class="form-check-label cursor-pointer" for="terms-{{ submit_id }}">
                {{ _("I accept the") }} <a href="#terms-title" class="terms-link">{{ cgv_tc_name or _("terms and conditions") }}</a>
            </label>
        </div>
        <div class="mt-4 d-flex justify-content-end">
            <button type="button"
                class="btn btn-primary btn-submit-payment"
                id="{{ submit_id }}"
                disabled
                data-toggle="tooltip"
                data-placement="top"
                title="{{ _('Please accept the terms and conditions to continue') }}">
                {{_('Pay with Wallee')}} {{format_currency_value(amount, currency)}}
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    // Prevent double initialization
    const formId = '{{ payment_form_id }}';
    if (window['wallee_initialized_' + formId]) return;
    window['wallee_initialized_' + formId] = true;

    let formData = checkout_manager.initPaymentForm(formId);
    let cardholderName = $('#' + formId + ' input[name="cardholder-name"]');
    let cardholderEmail = $('#' + formId + ' input[name="cardholder-email"]');
    let submitButton = $('#{{ submit_id }}');
    let isProcessingPayment = false;
    let walleeHandler = null;
    let walleePaymentMode = null;
    let iframeReady = false;
    let transactionCreated = false;

    // Pre-fill with existing data
    if (cardholderName.val() === '') {
        let firstName = $('#contact_first_name').val();
        let lastName = $('#contact_last_name').val();
        cardholderName.val(firstName + ' ' + lastName);
    }
    if (cardholderEmail.val() === '') {
        cardholderEmail.val($('#contact_email').val());
    }

    function showError(message) {
        $('.wallee-error-{{ submit_id }}').text(message).show().addClass('show');
        $('.wallee-success-{{ submit_id }}').hide().removeClass('show');
    }

    function showSuccess(message) {
        $('.wallee-success-{{ submit_id }}').text(message).show().addClass('show');
        $('.wallee-error-{{ submit_id }}').hide().removeClass('show');
    }

    function clearMessages() {
        $('.wallee-error-{{ submit_id }}').hide().removeClass('show');
        $('.wallee-success-{{ submit_id }}').hide().removeClass('show');
    }

    function validateForm() {
        // Skip cardholder validation for iFrame mode (Wallee handles it)
        if (walleePaymentMode === 'iFrame') {
            return true;
        }

        const name = cardholderName.val();
        const email = cardholderEmail.val();

        if (!name || !email) {
            console.error("Missing name or email:", name, email);
            showError("{{ _('Please fill in all fields') }}");
            return false;
        }

        if (!checkout_manager.isValidEmail(email)) {
            console.error("Invalid email:", email);
            showError("{{ _('Please enter a valid email address') }}");
            return false;
        }

        return true;
    }

    // Reset button state function
    const resetButtonState = function() {
        isProcessingPayment = false;
        submitButton.prop('disabled', false);

        // Use appropriate button text based on mode
        let buttonText;
        if (walleePaymentMode === 'iFrame' && iframeReady) {
            buttonText = '{{_("Confirm Payment")}} {{format_currency_value(amount, currency)|replace("'", "\\'")}}';
        } else {
            buttonText = '{{_("Pay with Wallee")}} {{format_currency_value(amount, currency)|replace("'", "\\'")}}';
        }
        submitButton.html(buttonText);

        // Re-enable button only if terms are still accepted
        const termsAccepted = $('#' + formId).closest('.payment-method-item').find('.terms-acceptance').prop('checked');
        if (!termsAccepted) {
            submitButton.prop('disabled', true);
        }
        // Call global stop processing after local reset
        if (checkout_manager && !checkout_manager._isResetting) {
            checkout_manager.stopPaymentProcessing();
        }
    };

    // Load Wallee JavaScript for Lightbox/iFrame modes
    function loadWalleeScript(javascriptUrl, callback) {
        // Remove any existing Wallee script
        $('script[src*="wallee"]').filter(function() {
            return this.src.includes('lightbox') || this.src.includes('iframe');
        }).remove();

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = javascriptUrl;
        script.onload = callback;
        script.onerror = function() {
            showError("{{ _('Failed to load payment form') }}");
            resetButtonState();
        };
        document.head.appendChild(script);
    }

    // Initialize Lightbox payment
    function initLightboxPayment(javascriptUrl) {
        loadWalleeScript(javascriptUrl, function() {
            if (window.LightboxCheckoutHandler) {
                showSuccess("{{ _('Opening payment form...') }}");
                // Start payment without specific payment method (let user choose in lightbox)
                // Pass undefined to show all available payment methods
                window.LightboxCheckoutHandler.startPayment(undefined, function() {
                    showError("{{ _('An error occurred during payment initialization') }}");
                    resetButtonState();
                });
            } else {
                showError("{{ _('Payment form not available') }}");
                resetButtonState();
            }
        });
    }

    // Helper to extract localized string from dict (e.g. {"en-US": "Credit Card"} -> "Credit Card")
    function getLocalizedString(value) {
        if (!value) return '';
        if (typeof value === 'string') return value;
        if (typeof value === 'object') {
            // Try common locales in order of preference
            return value['fr-FR'] || value['en-US'] || value['de-DE'] || Object.values(value)[0] || '';
        }
        return String(value);
    }

    // Initialize iFrame payment with specific payment method ID
    // The payment_method_id comes from Payment Gateway Account configuration
    function initIframePayment(javascriptUrl, paymentMethodId) {
        const containerId = 'wallee-iframe-container-{{ submit_id }}';
        const $container = $('#' + containerId);

        // Hide cardholder fields immediately for iFrame mode (Wallee handles them)
        $('#' + formId + ' .form-row.row').first().hide();

        if (paymentMethodId) {
            selectedPaymentMethodId = paymentMethodId;

            // Create container for iframe
            $container.show().html('<div id="wallee-iframe-inner-{{ submit_id }}" style="min-height: 200px;"></div>');

            // Load iframe directly with the specific payment method
            loadIframeForMethod(javascriptUrl, selectedPaymentMethodId);
        } else {
            // No payment method ID available, show error
            $container.show().html('<div class="alert alert-warning">{{ _("No payment method configured") }}</div>');
        }
    }

    let selectedPaymentMethodId = null;

    function loadIframeForMethod(javascriptUrl, paymentMethodId) {
        const innerContainerId = 'wallee-iframe-inner-{{ submit_id }}';
        const $innerContainer = $('#' + innerContainerId);
        $innerContainer.html('<div class="text-center p-4"><span class="spinner-border"></span> {{ _("Loading payment form...") }}</div>');

        // Reset handler
        walleeHandler = null;
        iframeReady = false;

        loadWalleeScript(javascriptUrl, function() {
            if (window.IframeCheckoutHandler) {
                try {
                    // Create handler with specific payment method
                    walleeHandler = window.IframeCheckoutHandler(paymentMethodId);

                    walleeHandler.setValidationCallback(function(validationResult) {
                        if (validationResult.success) {
                            showSuccess("{{ _('Processing payment...') }}");
                            walleeHandler.submit();
                        } else {
                            showError(validationResult.message || "{{ _('Please check your payment details') }}");
                            resetButtonState();
                        }
                    });

                    walleeHandler.setInitializeCallback(function() {
                        iframeReady = true;
                        $innerContainer.find('.spinner-border').parent().remove();
                        clearMessages();
                        // Update button text for iFrame mode
                        submitButton.html('{{_("Confirm Payment")}} {{format_currency_value(amount, currency)}}');
                        resetButtonState();
                    });

                    walleeHandler.setHeightChangeCallback(function(height) {
                        $innerContainer.css('min-height', height + 'px');
                    });

                    // Create the iframe in the inner container
                    walleeHandler.create(innerContainerId);
                } catch (e) {
                    console.error('iFrame initialization error:', e);
                    showError("{{ _('Failed to initialize payment form') }}");
                    resetButtonState();
                }
            } else {
                showError("{{ _('Payment form not available') }}");
                resetButtonState();
            }
        });
    }

    // Two-step Wallee transaction creation (post-fusion: payment_handler →
    // payments.integrations.wallee.api). Mirrors the Stripe template pattern.
    //
    // Returns a Promise resolving to the create_web_transaction message
    // ({status, payment_mode, payment_url|javascript_url, payment_method_id, transaction_id})
    // or rejecting with an error string.
    function createWalleeTransaction(mode) {
        return new Promise(function(resolve, reject) {
            // Step 1: create the generic Payment Request via the webshop handler.
            frappe.call({
                method: 'webshop.controllers.payment_handler.create_payment_request',
                args: {
                    quotation_id: '{{ doc.name }}',
                    gateway_settings: 'Wallee Settings',
                    idempotency_token: checkout_manager.getIdempotencyToken()
                },
                callback: function(r) {
                    if (!r.message || r.message.status !== 'success') {
                        return reject((r.message && r.message.message) || "{{ _('Error creating payment request') }}");
                    }
                    const payment_request_id = r.message.payment_request_id;

                    // Step 2: create the Wallee transaction for the given mode.
                    frappe.call({
                        method: 'payments.integrations.wallee.api.create_web_transaction',
                        args: {
                            payment_request_id: payment_request_id,
                            mode: mode,
                            success_url: window.location.origin + '/wallee/success?payment_request=' + encodeURIComponent(payment_request_id),
                            failed_url: window.location.origin + '/wallee/failed?payment_request=' + encodeURIComponent(payment_request_id)
                        },
                        callback: function(r2) {
                            if (r2.message && r2.message.status === 'success') {
                                resolve(r2.message);
                            } else {
                                reject((r2.message && r2.message.message) || "{{ _('Error creating Wallee transaction') }}");
                            }
                        },
                        error: function() {
                            reject("{{ _('Error communicating with server') }}");
                        }
                    });
                },
                error: function() {
                    reject("{{ _('Error communicating with server') }}");
                }
            });
        });
    }

    // Create transaction and initialize payment form (for iFrame mode on load)
    function createTransactionAndInitialize() {
        if (transactionCreated) return;
        transactionCreated = true;

        const containerId = 'wallee-iframe-container-{{ submit_id }}';
        const $container = $('#' + containerId);
        $container.show().html('<div class="text-center p-4"><span class="spinner-border"></span> {{ _("Loading payment form...") }}</div>');

        createWalleeTransaction('iFrame').then(function(msg) {
            walleePaymentMode = msg.payment_mode;
            if (walleePaymentMode === 'iFrame') {
                initIframePayment(msg.javascript_url, msg.payment_method_id);
            } else {
                $container.hide();
                transactionCreated = false;
            }
        }).catch(function(err) {
            showError(err);
            $container.hide();
            transactionCreated = false;
        });
    }

    // Get payment mode and initialize appropriately
    function initializePaymentMode() {
        frappe.call({
            method: 'webshop.templates.payments.wallee.get_payment_mode',
            callback: function(r) {
                if (r.message) {
                    walleePaymentMode = r.message;

                    // For iFrame mode, hide cardholder fields immediately and create transaction
                    if (walleePaymentMode === 'iFrame') {
                        // Hide cardholder fields immediately - Wallee handles them in the iFrame
                        $('#' + formId + ' .form-row.row').first().hide();
                        createTransactionAndInitialize();
                    }
                }
            }
        });
    }

    // Handle click on payment button
    submitButton.on('click', function(e) {
        e.preventDefault();

        // For iFrame mode with initialized handler, validate and submit
        if (walleePaymentMode === 'iFrame' && walleeHandler && iframeReady) {
            if (!validateForm()) {
                return;
            }
            if (!checkout_manager.startPaymentProcessing()) {
                return false;
            }
            isProcessingPayment = true;
            submitButton.prop('disabled', true);
            submitButton.html('<span class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>' + __('Processing...'));
            walleeHandler.validate();
            return;
        }

        // Prevent multiple clicks - use both local and global locks
        if (isProcessingPayment || !checkout_manager.startPaymentProcessing()) {
            console.log("Payment already in progress, ignoring click");
            return false;
        }

        if (!validateForm()) {
            checkout_manager.stopPaymentProcessing();
            return;
        }

        // Set processing state and disable button
        isProcessingPayment = true;
        submitButton.prop('disabled', true);

        // Add loading state
        submitButton.html('<span class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>' + __('Processing...'));

        showSuccess("{{ _('Preparing payment...') }}");

        // Create payment request + Wallee transaction (2-step pattern)
        createWalleeTransaction(walleePaymentMode || 'Redirect').then(function(msg) {
            walleePaymentMode = msg.payment_mode;
            if (walleePaymentMode === 'Redirect') {
                submitButton.html('<span class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>' + __('Redirecting to Wallee...'));
                showSuccess("{{ _('Redirecting to payment page...') }}");
                window.location.href = msg.payment_url;
            } else if (walleePaymentMode === 'Lightbox') {
                initLightboxPayment(msg.javascript_url);
            } else if (walleePaymentMode === 'iFrame') {
                // iFrame fallback if not pre-loaded
                initIframePayment(msg.javascript_url, msg.payment_method_id);
            }
        }).catch(function(err) {
            showError(err);
            resetButtonState();
        });
    });

    // Initial button state
    submitButton.addClass('disabled').attr('disabled', 'disabled');

    // Initialize payment mode on load
    initializePaymentMode();
})();
</script>
